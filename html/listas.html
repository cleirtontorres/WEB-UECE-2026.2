<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas em HTML</h1>

    <h2>Listas não ordenadas</h2>
    <P>Para criar uma lista não ordenada usa-se a tag ul.</P>

    <ul>
        <li>banana</li>
        <li>limao</li>
        <li>pera</li>
        <li>uva</li>
    </ul>

    <P>Para criar uma lista  ordenada usa-se a tag ol.</P>

      <ol>
        <li>primeiro</li>
        <li>segundo </li>
        <li>terceiro</li>
        <li>quarto</li>
    </ol>
</body>
</html>
