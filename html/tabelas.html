<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
</head>
<body>
    <h1>Tabelas em HTML</h1>

    <p>Para criar uma tabela em html usa a tag table.</p>


    <p>table</p>
    
    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>ovo</td>
                <td>2,00</td>
            </tr>

             <tr>
                <td>uva</td>
                <td>5,00</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>total</td>
                <td>7,00</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
